      <g stroke="black" stroke-width="1.2" stroke-linecap="round">
        <path d="M8 4.9V11.2"/>
        <path d="M8 5.4L10.6 8"/>
        <circle cx="8" cy="4.9" r="1.1" fill="black" stroke="none"/>
